 opacity="1">Tell us a little</text><text x="24" y="158" font-family="Inter, Inter Display, Arial, sans-serif" font-size="29" font-weight="850" text-anchor="start" fill="#17172F" opacity="1">about your routine.</text><text x="24" y="194" font-family="Inter, Inter Display, Arial, sans-serif" font-size="13" font-weight="500" text-anchor="start" fill="#777B94" opacity="1">This helps match challenges to your daily life.</text><text x="24" y="248" font-family="Inter, Inter Display, Arial, sans-serif" font-size="11" font-weight="800" text-anchor="start" fill="#795BF3" opacity="1">QUESTION 02 OF 04</text><text x="365" y="248" font-family="Inter, Inter Display, Arial, sans-serif" font-size="12" font-weight="750" text-anchor="end" fill="#17172F" opacity="1">50%</text><rect x="24" y="263" width="342" height="7" rx="4" fill="#E5E1F1" opacity="1"/><rect x="24" y="263" width="171" height="7" rx="4" fill="#795BF3" opacity="1"/><text x="24" y="322" font-family="Inter, Inter Display, Arial, sans-serif" font-size="25" font-weight="800" text-anchor="start" fill="#17172F" opacity="1">How do you usually</text><text x="24" y="354" font-family="Inter, Inter Display, Arial, sans-serif" font-size="25" font-weight="800" text-anchor="start" fill="#17172F" opacity="1">travel short distances?</text><rect x="24" y="379" width="342" height="60" rx="16" fill="#FFFFFF" opacity="1" stroke="#E5E3ED" stroke-width="1"/><circle cx="54" cy="409" r="14" fill="#F1F0F8" opacity="1"/><text x="54" y="413" font-family="Inter, Inter Display, Arial, sans-serif" font-size="10" font-weight="800" text-anchor="middle" fill="#8B86A6" opacity="1">01</text><text x="80" y="414" font-family="Inter, Inter Display, Arial, sans-serif" font-size="14" font-weight="550" text-anchor="start" fill="#17172F" opacity="1">Walk most of the time</text><rect x="24" y="451" width="342" height="60" rx="16" fill="#FFFFFF" opacity="1" stroke="#E5E3ED" stroke-width="1"/><circle cx="54" cy="481" r="14" fill="#F1F0F8" opacity="1"/><text x="5